<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <radialGradient id="sky" cx="72%" cy="62%" r="70%">
      <stop offset="0" stop-color="#2A3E6E"/><stop offset=".45" stop-color="#14254A"/><stop offset="1" stop-color="#080F22"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B54A" stop-opacity="0"/><stop offset="1" stop-color="#E8B54A" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#1E3360" stroke-width="1"/></pattern>
    <pattern id="win" width="22" height="26" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="12" height="14" fill="#F6D88E" fill-opacity=".14"/></pattern>
    <pattern id="winlit" width="22" height="26" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="12" height="14" fill="#F6D88E" fill-opacity=".55"/></pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity=".7"/>
  <!-- Vòng tròn kỹ thuật kiểu la bàn -->
  <g stroke="#2B4577" stroke-width="1.5" opacity=".8">
    <circle cx="1420" cy="330" r="300"/><circle cx="1420" cy="330" r="240" stroke-dasharray="4 10"/><circle cx="1420" cy="330" r="180"/>
    <path d="M1420 10V650M1100 330H1740M1194 104L1646 556M1646 104L1194 556"/>
  </g>
  <!-- Quầng sáng chân trời -->
  <rect x="0" y="640" width="1920" height="300" fill="url(#haze)"/>
  <ellipse cx="1350" cy="860" rx="700" ry="90" fill="#E8B54A" opacity=".25" filter="url(#glow)"/>

  <!-- Toà nhà nền xa -->
  <g fill="#0F1D3D" stroke="#2B4577" stroke-width="1.5">
    <rect x="900" y="560" width="120" height="380"/><rect x="1040" y="500" width="90" height="440"/><rect x="1700" y="540" width="130" height="400"/><rect x="1840" y="600" width="90" height="340"/>
  </g>
  <!-- Toà nhà chính -->
  <g stroke="#5D86B8" stroke-width="2">
    <rect x="1150" y="380" width="200" height="560" fill="#12224A"/>
    <rect x="1150" y="380" width="200" height="560" fill="url(#win)"/>
    <rect x="1370" y="300" width="150" height="640" fill="#13264F"/>
    <rect x="1370" y="300" width="150" height="640" fill="url(#winlit)" opacity=".7"/>
    <rect x="1540" y="460" width="150" height="480" fill="#12224A"/>
    <rect x="1540" y="460" width="150" height="480" fill="url(#win)"/>
  </g>
  <!-- Toà đang thi công: khung dầm cột -->
  <g stroke="#E8B54A" stroke-width="2.5" opacity=".95">
    <path d="M1560 200V460M1620 200V460M1680 200V460M1560 200H1680M1560 252H1680M1560 304H1680M1560 356H1680M1560 408H1680"/>
    <path d="M1560 200L1620 252M1620 200L1680 252M1560 304L1620 356M1620 304L1680 356" stroke-width="1.2" opacity=".6"/>
  </g>
  <!-- Cần cẩu tháp -->
  <g stroke="#F6D88E" stroke-width="2.5">
    <path d="M1760 940V150M1790 940V150M1760 150H1790"/>
    <path d="M1760 900L1790 860L1760 820L1790 780L1760 740L1790 700L1760 660L1790 620L1760 580L1790 540L1760 500L1790 460L1760 420L1790 380L1760 340L1790 300L1760 260L1790 220L1760 180" stroke-width="1.2"/>
    <path d="M1500 150H1900M1500 170H1900M1775 90L1500 150M1775 90L1900 150M1775 90V150"/>
    <path d="M1520 150L1540 170L1560 150L1580 170L1600 150L1620 170L1640 150L1660 170L1680 150L1700 170L1720 150L1740 170L1760 150" stroke-width="1.2"/>
    <path d="M1600 170V330" stroke-width="1.5"/>
    <rect x="1585" y="330" width="30" height="20" fill="#E8B54A"/>
    <rect x="1850" y="170" width="44" height="34" fill="#1B2D57"/>
  </g>
  <!-- Đường kích thước vàng -->
  <g stroke="#E8B54A" stroke-width="1.5" opacity=".75">
    <path d="M1150 960H1690M1150 950V970M1350 950V970M1520 950V970M1690 950V970"/>
    <path d="M1120 380V940M1110 380H1130M1110 940H1130"/>
  </g>
  <!-- Mặt đất -->
  <rect x="0" y="940" width="1920" height="140" fill="#070D1E"/>
  <path d="M0 940H1920" stroke="#E8B54A" stroke-width="2" opacity=".6"/>
</svg>
