<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 · Lời kêu gọi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Noto+Serif:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="deck.css" rel="stylesheet">
<style>
  .copy { position: absolute; left: 96px; top: 270px; width: 1100px; display: flex; flex-direction: column; gap: 34px; z-index: 3; }
  .copy h1 { font-size: 124px; }
  .asks { display: flex; flex-direction: column; gap: 16px; }
  .asks .check { font-size: 30px; color: var(--ink); }
  .asks .check b { color: var(--gold-2); }
  .contact { position: absolute; left: 96px; bottom: 64px; display: flex; gap: 48px; font-size: 24px; color: var(--muted); z-index: 3; }
  .contact b { color: var(--ink); font-weight: 600; }
  .thanks { position: absolute; right: 96px; bottom: 150px; font-family: var(--serif); font-style: italic; font-size: 64px; color: var(--gold-2); z-index: 3; }
</style>
</head>
<body data-image="assets/s10.webp,assets/s10.jpg,assets/s10.png">
<div class="stage" id="stage">
  <div class="bg"><div class="kb" style="--kb-origin:80% 40%"><img class="scene" src="assets/scene-city.svg" alt=""><img class="photo" alt=""></div></div>
  <div class="scrim"></div><div class="vignette"></div><div class="dust"></div><div class="grain"></div>

  <header class="brand small anim" style="--d:.2s">
    <div class="logo"><img src="assets/logo-tdu.png" alt="Logo Trường Đại học Thành Đông"></div>
    <span class="name">TRƯỜNG ĐẠI HỌC THÀNH ĐÔNG</span>
  </header>

  <section class="copy">
    <h1>
      <span class="mask"><span class="line" style="--d:.4s">Mỗi con số</span></span>
      <span class="mask"><span class="line hl" style="--d:.6s">đều có nguồn.</span></span>
    </h1>
    <div class="rule anim" style="--d:1s"></div>
    <div class="asks">
      <div class="check anim left" style="--d:1.2s"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M24 4l16 6v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/></svg>Vốn: <b>khoảng 400 triệu đồng</b> cho 12 tháng</div>
      <div class="check anim left" style="--d:1.35s"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M24 4l16 6v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/></svg>Bản vẽ thật từ ít nhất 3 đơn vị thiết kế</div>
      <div class="check anim left" style="--d:1.5s"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M24 4l16 6v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/></svg>Kỹ sư dự toán chấm đối chiếu theo hạng mục</div>
    </div>
  </section>

  <div class="thanks anim" style="--d:1.8s">Xin cảm ơn!</div>
  <div class="contact anim" style="--d:2s"><b>Hồ Ngọc Trung</b><span>hongoctrung1120@gmail.com</span><span>0944567716</span><span>Demo: doc-autocad-mcp-demo.onrender.com</span></div>
</div>
<script src="deck.js"></script>
</body>
</html>
