<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 · KPI cốt lõi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Noto+Serif:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="deck.css" rel="stylesheet">
<style>
  .glowbg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(232,181,74,.32) 0%, rgba(11,22,48,0) 55%), #0A1430; }
  .rings { position: absolute; left: 50%; top: 52%; width: 1000px; height: 1000px; transform: translate(-50%, -50%); }
  .run .rings { animation: spin 80s linear infinite; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .center { position: absolute; left: 0; right: 0; top: 220px; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; z-index: 3; }
  .eyebrow::before { content: ""; width: 120px; height: 2px; background: var(--gold); opacity: .7; }
  .kpi { font-weight: 900; line-height: 1.05; letter-spacing: -4px; }
  .kpi .a { display: block; font-size: 130px; color: var(--ink); text-transform: uppercase; letter-spacing: -2px; }
  .kpi .b { display: block; font-size: 290px; }
  .center .lead { max-width: 1300px; font-size: 42px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glowbg"></div>
  <svg class="rings" viewBox="0 0 1000 1000" fill="none" aria-hidden="true"><g stroke="#E8B54A" stroke-opacity=".22"><circle cx="500" cy="500" r="490" stroke-width="2"/><circle cx="500" cy="500" r="420" stroke-dasharray="3 14" stroke-width="3"/><circle cx="500" cy="500" r="350"/><path d="M500 10V90M500 910V990M10 500H90M910 500H990" stroke-width="3"/></g></svg>
  <div class="dust"></div><div class="vignette"></div><div class="grain"></div>

  <section class="center">
    <div class="eyebrow anim" style="--d:.2s">KPI cốt lõi</div>
    <h2 class="kpi">
      <span class="mask"><span class="line a" style="--d:.45s">Tỷ lệ bịa</span></span>
      <span class="mask"><span class="line b hl" style="--d:.7s">≈ 0%</span></span>
    </h2>
    <p class="lead anim" style="--d:1.3s">Không phải trả lời 100% câu hỏi — mà là mọi con số đã đưa ra đều đúng và chỉ được về vị trí trên bản vẽ.</p>
  </section>

  <footer class="foot anim" style="--d:1.6s">AUTOCAD MCP<span class="pg">06</span></footer>
</div>
<script src="deck.js"></script>
</body>
</html>
